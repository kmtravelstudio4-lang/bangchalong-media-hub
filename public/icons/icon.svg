<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003875"/>
      <stop offset="60%" stop-color="#005BAC"/>
      <stop offset="100%" stop-color="#002852"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Inner Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#003875" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.4"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Radial Glow Behind Emblems -->
  <circle cx="256" cy="220" r="180" fill="url(#sunGlow)"/>

  <!-- Decorative Rays of Wisdom -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <line x1="256" y1="60" x2="256" y2="85" />
    <line x1="160" y1="90" x2="175" y2="110" />
    <line x1="352" y1="90" x2="337" y2="110" />
    <line x1="80" y1="165" x2="105" y2="175" />
    <line x1="432" y1="165" x2="407" y2="175" />
  </g>

  <!-- Central Torch of Knowledge -->
  <g transform="translate(256, 155)">
    <!-- Torch Flame -->
    <path d="M0 -65 C15 -45, 30 -30, 20 -5 C10 15, -10 15, -20 -5 C-30 -30, -15 -45, 0 -65 Z" fill="url(#goldGrad)"/>
    <path d="M0 -45 C8 -32, 12 -20, 8 -8 C4 3, -4 3, -8 -8 C-12 -20, -8 -32, 0 -45 Z" fill="#FFFFFF"/>
    
    <!-- Torch Handle -->
    <path d="M-12 12 L12 12 L8 45 L-8 45 Z" fill="url(#goldGrad)"/>
    <rect x="-16" y="8" width="32" height="6" rx="3" fill="#FFE082"/>
  </g>

  <!-- Open Book Symbol of Education -->
  <g transform="translate(256, 280)">
    <!-- Book Shadow -->
    <path d="M-150 45 Q-75 10 0 45 Q75 10 150 45 L150 85 Q75 50 0 85 Q-75 50 -150 85 Z" fill="#001830" opacity="0.4"/>

    <!-- Book Backing Pages -->
    <path d="M-140 25 Q-70 -10 0 22 Q70 -10 140 25 L135 70 Q70 35 0 65 Q-70 35 -135 70 Z" fill="#E2E8F0"/>

    <!-- Left Main Page -->
    <path d="M0 20 Q-70 -15 -135 15 L-130 60 Q-70 30 0 55 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Right Main Page -->
    <path d="M0 20 Q70 -15 135 15 L130 60 Q70 30 0 55 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Book Spine -->
    <path d="M-4 22 L4 22 L4 65 L-4 65 Z" fill="url(#goldGrad)"/>

    <!-- Book Content Lines (Left) -->
    <line x1="-115" y1="28" x2="-25" y2="38" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-115" y1="38" x2="-35" y2="46" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-110" y1="48" x2="-45" y2="54" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Book Content Lines (Right) -->
    <line x1="25" y1="38" x2="115" y2="28" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="46" x2="115" y2="38" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="54" x2="110" y2="48" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- AI Sparkles / Innovation Stars -->
  <g fill="url(#goldGrad)">
    <!-- Top Right Sparkle -->
    <path d="M380 140 Q395 140 395 125 Q395 140 410 140 Q395 140 395 155 Q395 140 380 140 Z"/>
    <circle cx="420" cy="120" r="4" fill="#FFE082"/>
    
    <!-- Top Left Sparkle -->
    <path d="M110 150 Q120 150 120 140 Q120 150 130 150 Q120 150 120 160 Q120 150 110 150 Z" opacity="0.8"/>
  </g>

  <!-- School Ribbon / Banner -->
  <g transform="translate(256, 395)">
    <!-- Ribbon Tail Left -->
    <path d="M-190 25 L-140 -5 L-140 35 L-170 45 Z" fill="#C97D00"/>
    <!-- Ribbon Tail Right -->
    <path d="M190 25 L140 -5 L140 35 L170 45 Z" fill="#C97D00"/>

    <!-- Main Banner Body -->
    <rect x="-160" y="-8" width="320" height="46" rx="23" fill="url(#goldGrad)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
    <rect x="-156" y="-4" width="312" height="38" rx="19" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- School Thai Typography -->
    <text x="0" y="21" font-family="'Noto Sans Thai', 'Prompt', sans-serif" font-size="21" font-weight="900" fill="#003875" text-anchor="middle" letter-spacing="1">
      โรงเรียนวัดบางโฉลงใน
    </text>
  </g>

  <!-- Subtitle Tag -->
  <text x="256" y="468" font-family="'Noto Sans Thai', 'Prompt', sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="2" opacity="0.95">
    คลังสื่อการสอน &amp; นวัตกรรม AI
  </text>
</svg>
